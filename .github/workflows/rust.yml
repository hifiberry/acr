name: Rust

# Every branch, not just main. A feature branch that only gets CI once it is
# already a pull request against main is a branch whose commits were never
# checked, and this repository has had twenty land that way.
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libasound2-dev pkg-config
    - name: Build
      run: cargo build --workspace --verbose
    - name: Run tests
      run: cargo test --workspace --verbose
    - name: Crate dependency direction
      run: sh scripts/check-crate-deps.sh
