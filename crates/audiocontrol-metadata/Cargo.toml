[package]
name = "audiocontrol-metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "External metadata providers, cover art and accounts for AudioControl"
build = "build.rs"

[lib]
name = "audiocontrol_metadata"
path = "src/lib.rs"

[dependencies]
acr-types = { path = "../acr-types" }
acr-http = { path = "../acr-http" }
acr-images = { path = "../acr-images" }
acr-store = { path = "../acr-store" }
acr-web = { path = "../acr-web" }
serde.workspace = true
serde_json.workspace = true
log.workspace = true
thiserror.workspace = true
chrono.workspace = true
rocket.workspace = true
ureq.workspace = true
image.workspace = true
base64.workspace = true
md5.workspace = true
urlencoding.workspace = true
deunicode.workspace = true
strsim.workspace = true
moka.workspace = true
regex.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
crossbeam.workspace = true
aes-gcm.workspace = true
rand.workspace = true
hex.workspace = true
url.workspace = true
tokio.workspace = true
# For the command line tools in src/bin/
clap.workspace = true
env_logger.workspace = true

[build-dependencies]
base64.workspace = true
md5.workspace = true

[dev-dependencies]
tempfile.workspace = true
serial_test.workspace = true

# The metadata command line tools. Named explicitly so the installed binaries
# keep the names they had when these were targets of the root package.
[[bin]]
name = "audiocontrol_dump_cache"
path = "src/bin/audiocontrol_dump_cache.rs"

[[bin]]
name = "audiocontrol_dump_store"
path = "src/bin/audiocontrol_dump_store.rs"

[[bin]]
name = "audiocontrol_favourites"
path = "src/bin/audiocontrol_favourites.rs"

[[bin]]
name = "audiocontrol_musicbrainz_client"
path = "src/bin/audiocontrol_musicbrainz_client.rs"
